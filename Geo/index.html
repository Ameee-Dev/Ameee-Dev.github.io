// Deterministic geometry scenery. Uses the game's foreground/background colors;
// terrain never participates in collision, targeting or the gameplay RNG.
const c2TerrainCache=new Map();
function c2TerrainHash(x,y=0){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}

  if(shade>0){c.globalAlpha=shade;c.fillStyle=fg;c.fill();}
  c.globalAlpha=lineAlpha;c.strokeStyle=fg;c.lineWidth=lineWidth;c.stroke();
}
function c2TerrainPeaks(w,h){
  const key=Math.round(w)+'x'+Math.round(h);
  if(c2TerrainCache.has(key))return c2TerrainCache.get(key);
  const small=w<600,cols=small?5:10,rows=small?9:7,cw=w/(cols-1),ch=h/(rows-1),peaks=[];
  for(let j=-1;j<rows+1;j++)for(let i=-1;i<cols+1;i++){
    const a=c2TerrainHash(i+13,j+19),b=c2TerrainHash(i+71,j+5),nx=(i+.28+(a-.5)*.52)/(cols-1),ny=(j+.25+(b-.5)*.4)/(rows-1);
    // A meandering empty floor keeps the combat silhouette legible.
    const valley=.5+Math.sin(ny*5.2+.5)*.065,dist=Math.abs(nx-valley);
    if(dist<.135||c2TerrainHash(i+9,j+45)<.14)continue;
    const depth=.58+Math.max(0,Math.min(1,ny))*.5;
    const radius=Math.min(cw*.48,ch*.7)*(small?.94:1)*(.62+a*.6)*depth;
    peaks.push({x:nx*w,y:ny*h,rx:radius,ry:radius*.42,height:radius*(.8+b*1.0),
      n:[3,4,5,18][(i*3+j*7+120)%4],angle:(a-.5)*1.1,depth,
      fade:Math.max(.26,Math.min(1,(dist-.12)*4.6))});
  }
  peaks.sort((a,b)=>a.y-b.y||a.height-b.height);
  c2TerrainCache.clear();c2TerrainCache.set(key,peaks);return peaks;
}

  const a=Math.max(0,Math.min(.3,alpha));

    const p=centers.filter(p=>p.x>=0&&p.x<=W&&p.y>=0&&p.y<=H).sort((a,b)=>(a.x-x)**2+(a.y-y)**2-((b.x-x)**2+(b.y-y)**2))[0];

  }return best;

function c4Hit(e,damage,bullet=null){

 return {product:'Geometric Echo',schema:1,savedAt:at,checkpoint:{chapter:c,level:l,coins:Math.floor(q.coins),upgrades:[...q.upgrades],completed:!!q.completed},unlocks,light:!!raw.light,skin};
}
function echoReadSlots(){try{const a=JSON.parse(localStorage.getItem(ECHO_SAVE_KEY)||'[]');return [0,1,2].map(i=>{try{return a[i]?echoValidateSave(a[i]):null;}catch(_){return null;}});}catch(_){return [null,null,null];}}
function echoCaptureSave(){
 if(!['play','clear','over','win'].includes(st))throw Error('进入关卡后即可保存');
 return echoValidateSave({product:'Geometric Echo',schema:1,savedAt:new Date().toISOString(),checkpoint:{chapter,level:lv,coins,upgrades:[...up],completed:st==='win'},unlocks:UN,light:document.documentElement.classList.contains('lt'),skin:activeSkin()});
}
function echoSaveStatus(text,error=false){$('saveStatus').textContent=text;$('saveStatus').style.color=error?'var(--ac)':'var(--fg)';}
function echoWriteSlot(index){try{if(![0,1,2].includes(index))throw Error('存档位置无效');const record=echoCaptureSave(),slots=echoReadSlots();slots[index]=record;localStorage.setItem(ECHO_SAVE_KEY,JSON.stringify(slots));refreshSaveSlots();echoSaveStatus('已保存到存档 '+(index+1)+' · 从本关起点继续');return true;}catch(e){echoSaveStatus(e.message||'保存失败，请导出文本备份',true);return false;}}
function echoApplySave(raw){
 const save=echoValidateSave(raw); // Validate everything before mutating live state.
 localStorage.setItem('jhdm',JSON.stringify(save.unlocks));
 cancelGameEnding();screenFade=null;$('screenFade').hidden=true;UN={...save.unlocks};chapter=save.checkpoint.chapter;LV=CHAPTERS[chapter];lv=save.checkpoint.level;coins=save.checkpoint.coins;up=[...save.checkpoint.upgrades];
 selectedSkin=skinUnlocked(save.skin)?save.skin:'classic';try{localStorage.setItem('geometricEcho.skin',selectedSkin);}catch(_){}
 document.documentElement.classList.toggle('lt',save.light);sync();P.x=W*.5;P.y=H*.64;P.a=-Math.PI/2;P.mv=null;reset();st='play';paused=false;pnWas=false;acc=0;
 for(const id of ['home','ch','pn','sp','dx','chapterIntro','ending','skins'])$(id).hidden=true;
 refreshCh();updateShellMode();hud();return true;
}
function echoLoadSlot(index){try{const record=echoReadSlots()[index];if(!record)throw Error('这里还没有存档');return echoApplySave(record);}catch(e){echoSaveStatus(e.message||'读取失败',true);return false;}}
function refreshSaveSlots(){
 const slots=echoReadSlots();$('saveSlots').innerHTML=slots.map((r,i)=>{const q=r?.checkpoint,desc=q?'第'+(q.chapter+1)+'章 / '+(q.level+1)+'关 · Lv'+q.upgrades.map(n=>n+1).join('/')+'<br>'+new Date(r.savedAt).toLocaleString('zh-CN'):'空存档';return '<div class="save-row"><small>存档 '+(i+1)+' · '+desc+'</small><button id="saveSlot'+i+'">保存</button><button id="loadSlot'+i+'" '+(r?'':'disabled')+'>读取</button></div>';}).join('');
 for(let i=0;i<3;i++){$('saveSlot'+i).onclick=()=>echoWriteSlot(i);$('loadSlot'+i).onclick=()=>echoLoadSlot(i);}
}
function echoExportSave(){try{const save=['play','clear','over','win'].includes(st)?echoCaptureSave():echoReadSlots().find(Boolean);if(!save)throw Error('还没有可导出的存档');$('saveData').value=JSON.stringify(save);echoSaveStatus('存档已写入文本框 · 长按全选复制后可转移设备');return true;}catch(e){echoSaveStatus(e.message,true);return false;}}
function echoImportSave(){let before,wrote=false;try{const text=String($('saveData').value||'').trim();if(text.length>100000)throw Error('存档文本过长');const save=echoValidateSave(JSON.parse(text)),slots=echoReadSlots();before=localStorage.getItem(ECHO_SAVE_KEY);slots[0]=save;localStorage.setItem(ECHO_SAVE_KEY,JSON.stringify(slots));wrote=true;return echoApplySave(save);}catch(e){if(wrote)try{if(before===null&&typeof localStorage.removeItem==='function')localStorage.removeItem(ECHO_SAVE_KEY);else localStorage.setItem(ECHO_SAVE_KEY,before||'[]');}catch(_){}echoSaveStatus('无法读取：'+(e instanceof SyntaxError?'存档文本不是有效 JSON':e.message),true);return false;}}
$('saveExport').onclick=echoExportSave;$('saveImport').onclick=echoImportSave;
window.geometricEchoSaves={exportCheckpoint:()=>JSON.stringify(echoCaptureSave()),importCheckpoint:text=>echoApplySave(JSON.parse(text)),saveSlot:echoWriteSlot,loadSlot:echoLoadSlot};


window.jhdmDebug={
  state:()=>{const boss=chapter===4?c5Boss:chapter===3?c4Boss:chapter===2?c3Boss:c2Boss;return {mode:st,paused,chapter,level:lv,levels:LV.length,bullets:B.length,missiles:Ms.length,effects:FX.length,pending:chapter===4?c5Pending.length+Pd.length:chapter===3?c4Pending.length+Pd.length:chapter===2?c3Pending.length:Pd.length,player:{x:P.x,y:P.y,hp:P.hp},enemies:E.map(e=>({t:e.t,x:e.x,y:e.y,hp:e.hp})),boss:boss&&{kind:boss.kind,hp:boss.totalHp??boss.hp,intro:boss.intro,stage:boss.stage,finished:boss.finished},warnings:c2Warnings.length,holes:HL.length,coins};},
  forceChapter:(i=1)=>{if(!CHAPTERS[i])return;paused=false;chapter=i;LV=CHAPTERS[i];lv=0;$('ch').hidden=true;$('pn').hidden=true;reset();st='play';},
  tick:(seconds=1)=>{for(let i=0;i<Math.ceil(seconds*120);i++)step(1/120);return window.jhdmDebug.state();},
  spawn:(t,x=W/2,y=H/2)=>{const e=chapter===4&&c5Is(t)?mk5(t,x,y):chapter===4&&String(t).endsWith('3')?mk3(t,x,y):chapter===2?mk3(t,x,y):chapter===3&&c4IsNew(t)?mk4(t,x,y):mk2(t,x,y);E.push(e);return e;},
  spawnBoss:(t)=>{if(chapter===4)return spawnC5Boss(t||'sierpinski5');if(chapter===3)return spawnC4Boss(t||'rose');if(chapter===2)return spawnC3Boss(t||'lord');spawnLelo(t||'r');return c2Boss;}
};
let last=0,acc=0;
function loop(t){const f=Math.min(.05,(t-last)/1000||0);last=Tn=t;
  document.documentElement.classList.toggle('world-glitch',!!UN.ch4clear&&!UN.ch5clear&&(st==='menu'||st==='win'));
  if(!paused){acc+=f;if(bs&&st=='play')bs.t+=f;if(bs)bossSq();while(acc>=1/120){step(1/120);acc-=1/120}}
  updateScreenFade(f);updateShellMode();updateEncodedScreens(t);
  if(st==='home')drawHome(t);else if($('ch').hidden){draw();hud()}else drawCh(t);
  requestAnimationFrame(loop)}
fit();sync();P.x=W/2;P.y=H/2;reset();showHome();
requestAnimationFrame(loop);



</script>
