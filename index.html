<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ame's personal GitHub site</title>
<style>
:root { --bg:#fff; --fg:#111; --mute:#6b7280; --line:#e5e7eb; color-scheme:light dark }
@media (prefers-color-scheme:dark) { :root { --bg:#0d1117; --fg:#e6edf3; --mute:#8b949e; --line:#30363d } }
body { font:16px/1.7 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:640px; margin:60px auto; padding:0 20px; animation:in .9s ease }
@keyframes in { from { opacity:0; transform:translateY(14px) } }
h1 { font-size:2.4rem; margin:.4em 0 0; background:linear-gradient(90deg,#2563eb,#9333ea); -webkit-background-clip:text; background-clip:text; color:transparent }
img { width:96px; height:96px; border-radius:50% }
p { color:var(--mute); margin:.3em 0 }
button { float:right; background:none; border:1px solid var(--line); color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer }
h2 { font-size:1.1rem; margin-top:2.5em }
#repos a { display:block; padding:12px 16px; margin:10px 0; border:1px solid var(--line); border-radius:10px; color:inherit; text-decoration:none; transition:.2s }
#repos a:hover { transform:translateY(-2px); border-color:#2563eb }
#repos span { display:block; color:var(--mute); font-size:.9rem }
</style>
</head>
<body>
<button id="lang"></button>
<img src="https://github.com/Ameee-Dev.png" alt="avatar">
<h1 data-zh="欢迎" data-en="Welcome"></h1>
<p data-zh="Ame的公共github主页" data-en="Ame's public GitHub page"></p>
<p data-zh="众人共建，人人共享。" data-en="Built by many, shared by all."></p>
<p><a href="https://github.com/Ameee-Dev">github.com/Ameee-Dev</a></p>

<h2 data-zh="我的项目" data-en="Projects"></h2>
<div id="repos"></div>

<script>
let zh = !navigator.language.startsWith('en');
const $ = s => document.querySelectorAll(s);
const esc = s => (s || '').replace(/[&<>]/g, c => ({ '&':'&', '<':'<', '>':'>' }[c]));

function render() {
  document.documentElement.lang = zh ? 'zh' : 'en';
  $('[data-zh]').forEach(e => e.textContent = e.dataset[zh ? 'zh' : 'en']);
  $('#lang')[0].textContent = zh ? 'EN' : '中文';
}
$('#lang')[0].onclick = () => { zh = !zh; render(); };

fetch('https://api.github.com/users/Ameee-Dev/repos?sort=updated')
  .then(r => r.json())
  .then(rs => (Array.isArray(rs) ? rs : []).filter(r => !r.fork && r.name !== 'Ameee-Dev.github.io'))
  .catch(() => [])
  .then(rs => {
    $('#repos')[0].innerHTML = rs.map(r =>
      `<a href="${r.html_url}"><b>${esc(r.name)}</b><span>${esc(r.description)}</span></a>`).join('')
      || '<p data-zh="暂无项目" data-en="No projects yet."></p>';
    render();
  });
render();
</script>
</body>
</html>
