<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ame</title>
<link rel="icon" href="https://github.com/Ameee-Dev.png">
<style>
:root { --bg:#fafafa; --fg:#161616; --mute:#6b7280; --line:#e5e7eb; --card:#fff; --a:#f5a623; --b:#2bb0e6; --yang:#b45309; --yin:#0369a1; color-scheme:light }
:root[data-theme=dark] { --bg:#0b0d12; --fg:#e8eaee; --mute:#8b93a1; --line:#262b36; --card:#12151c; --yang:#ffb938; --yin:#38c6ff; color-scheme:dark }
* { box-sizing:border-box }
body { margin:0; min-height:100vh; color:var(--fg); transition:color .3s;
  font:16px/1.7 system-ui,-apple-system,"Noto Sans SC","Noto Sans JP",sans-serif;
  background:radial-gradient(500px 260px at 15% 0,rgba(245,166,35,.13),transparent),
             radial-gradient(500px 260px at 85% 0,rgba(43,176,230,.13),transparent),var(--bg) }
main { max-width:640px; margin:0 auto; padding:88px 20px 60px; text-align:center }

/* 背景画布：铺满全屏、放在内容下面、不挡鼠标；opacity 调淡，避免影响文字阅读 */
#bg { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:.65 }
:root[data-theme=dark] #bg { opacity:.5 }

.bar { position:absolute; top:16px; right:16px; display:flex; gap:8px }
.ctl { height:36px; padding:0 12px; font:14px system-ui,sans-serif; color:var(--fg); background:var(--card);
  border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:.2s }
.ctl:hover { border-color:var(--b) }

.f { animation:in .8s cubic-bezier(.2,.7,.2,1) both; animation-delay:calc(var(--i) * .12s) }
@keyframes in { from { opacity:0; transform:translateY(16px) } }
@media (prefers-reduced-motion:reduce) { .f { animation:none } }

#av { width:128px; height:128px; border-radius:50%; object-fit:cover; border:4px solid transparent;
  background:linear-gradient(135deg,var(--a),var(--b)) border-box; box-shadow:0 8px 30px rgba(43,176,230,.25) }
h1 { margin:.7em 0 .1em; font-size:1.9rem; line-height:1.3; color:transparent;
  background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text }
.slogan { margin:.2em 0 1em }
.pill { display:inline-block; padding:6px 16px; color:var(--fg); text-decoration:none; background:var(--card);
  border:1px solid var(--line); border-radius:999px; transition:.2s }
.pill:hover { border-color:var(--b); transform:translateY(-2px) }

h2 { margin:3em 0 1em; font-size:1.15rem }
h2::after { content:""; display:block; width:36px; height:3px; margin:8px auto 0; border-radius:3px;
  background:linear-gradient(90deg,var(--a),var(--b)) }
#repos { display:grid; gap:12px; text-align:left }
#repos a { display:block; padding:14px 18px; color:inherit; text-decoration:none; background:var(--card);
  border:1px solid var(--line); border-radius:14px; transition:.2s }
#repos a:hover { transform:translateY(-3px); border-color:var(--b); box-shadow:0 8px 24px rgba(43,176,230,.15) }
#repos b { display:block }
#repos span { color:var(--mute); font-size:.9rem }
.empty { padding:28px; text-align:center; color:var(--mute); border:1px dashed var(--line); border-radius:14px }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="bar">
  <button id="theme" class="ctl" aria-label="Theme"></button>
  <select id="lang" class="ctl" aria-label="Language">
    <option value="zh">中文</option>
    <option value="ja">日本語</option>
    <option value="en">English</option>
  </select>
</div>

<main>
  <img id="av" class="f" style="--i:0" src="https://github.com/Ameee-Dev.png" alt="Ameee-Dev">
  <h1 class="f" style="--i:1" data-t="hint"></h1>
  <p class="slogan f" style="--i:2" data-t="slogan"></p>
  <p class="f" style="--i:3"><a class="pill" href="https://github.com/Ameee-Dev">github.com/Ameee-Dev</a></p>
  <section class="f" style="--i:4">
    <h2 data-t="projects"></h2>
    <div id="repos"></div>
  </section>
</main>

<script>
const T = {
  zh: { hint:'Ame的公共GitHub展示页', slogan:'众人共建，人人共享。', projects:'个人项目', empty:'暂无项目' },
  ja: { hint:'Ameの公開GitHubショーケース', slogan:'みんなで作り、みんなで共有。', projects:'個人プロジェクト', empty:'プロジェクトはまだありません' },
  en: { hint:"Ame's Public GitHub Showcase", slogan:'Built by many, shared by all.', projects:'Personal Projects', empty:'No projects yet' }
};
const $ = s => document.querySelector(s), root = document.documentElement;
const esc = s => new Option(s || '').innerHTML;
const get = k => { try { return localStorage.getItem(k) } catch {} };
const set = (k, v) => { try { localStorage.setItem(k, v) } catch {} };

let lang = T[get('lang')] ? get('lang') : ({ zh:'zh', ja:'ja' }[navigator.language.slice(0, 2)] || 'en');
let theme = get('theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');

function apply() {
  root.lang = lang;
  root.dataset.theme = theme;
  document.title = T[lang].hint;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = T[lang][e.dataset.t]);
  $('#theme').textContent = theme === 'dark' ? '🌙' : '☀️';
  $('#lang').value = lang;
}
$('#theme').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; set('theme', theme); apply(); };
$('#lang').onchange = e => { lang = e.target.value; set('lang', lang); apply(); };

fetch('https://api.github.com/users/Ameee-Dev/repos?sort=updated')
  .then(r => r.json())
  .then(rs => (Array.isArray(rs) ? rs : []).filter(r => !r.fork && r.name !== 'Ameee-Dev.github.io'))
  .catch(() => [])
  .then(rs => {
    $('#repos').innerHTML = rs.map(r =>
      `<a href="${encodeURI(r.homepage || r.html_url)}" target="_blank" rel="noopener"><b>${esc(r.name)}</b><span>${esc(r.description)}</span></a>`).join('')
      || '<div class="empty" data-t="empty"></div>';
    apply();
  });
apply();
</script>

<!-- 八卦字符背景动画 -->
<script>
(() => {
  let BG, YANG, YIN;                                   // 颜色跟随网站主题（深/浅）
  const FS = 11, SPEED = 0.5, GUA = true;              // SPEED：角速度 rad/s；GUA=false 则只留太极
  const T = GUA ? .58 : .9;                            // 太极半径（相对整体大小）
  const CODE = [7, 3, 5, 1, 0, 4, 2, 6];               // 乾兑离震坤艮坎巽，二进制低位=初爻，1=阳爻
  const cv = document.getElementById('bg'), ctx = cv.getContext('2d');
  const off = document.createElement('canvas'), ox = off.getContext('2d'); // 静止背景缓存
  let W, H, cw, ch, cols, rows, R;

  // 固定随机：同一个格子永远是同一个字符，所以背景是静止的
  const hash = (i, j) => {
    let h = Math.imul(i, 374761393) + Math.imul(j, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) & 1;
  };

  // 判断某点属于：0=空白，1=阳，2=阴。x,y 为相对中心的像素坐标，a 为旋转角
  const cls = (x, y, a) => {
    const c = Math.cos(a), s = Math.sin(a);
    const u = (x * c + y * s) / R, v = (-x * s + y * c) / R, r = Math.hypot(u, v);
    if (r <= T) {                                      // —— 太极阴阳鱼 ——
      const d1 = Math.hypot(u, v + T / 2), d2 = Math.hypot(u, v - T / 2), e = T * .14;
      if (d1 < e) return 1;
      if (d2 < e) return 2;
      return d1 < T / 2 ? 2 : d2 < T / 2 ? 1 : u > 0 ? 1 : 2;
    }
    if (!GUA || r < .66 || r > 1.05) return 0;          // —— 八卦环 ——
    const q = (-Math.PI / 2 - Math.atan2(v, u)) / (Math.PI / 4), k = Math.round(q);
    const dth = Math.abs(k - q) * Math.PI / 4;
    const i = Math.round((r - .72) / .125);            // 第几爻（0=初爻，最靠里）
    if (i < 0 || i > 2 || Math.abs(r - .72 - .125 * i) > .045 || dth > .27) return 0;
    if ((CODE[((k % 8) + 8) % 8] >> i) & 1) return 1;  // 阳爻：整条线
    return dth < .08 ? 0 : 2;                          // 阴爻：中间断开
  };

  function setup() {
    const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
    BG = v('--bg'); YANG = v('--yang'); YIN = v('--yin');
    const dpr = devicePixelRatio || 1;
    W = innerWidth; H = innerHeight;
    for (const c of [cv, off]) { c.width = W * dpr; c.height = H * dpr; }
    for (const c of [ctx, ox]) {
      c.setTransform(dpr, 0, 0, dpr, 0, 0);
      c.font = FS + 'px ui-monospace,Menlo,Consolas,monospace';
      c.textAlign = 'center'; c.textBaseline = 'middle';
    }
    cw = ctx.measureText('#').width; ch = FS * 1.2;
    cols = Math.ceil(W / cw); rows = Math.ceil(H / ch);
    R = Math.min(W, H) * 0.44;                         // 整体大小
    ox.fillStyle = BG; ox.fillRect(0, 0, W, H);
    ox.fillStyle = 'rgba(0,0,0,0)';                    // 静止背景字符（默认全透明，想要淡淡的底纹可调这里）
    for (let j = 0; j < rows; j++)
      for (let i = 0; i < cols; i++)
        ox.fillText(hash(i, j) ? '#' : '*', (i + .5) * cw, (j + .5) * ch);
  }

  const paint = (L, s, color) => {
    ctx.fillStyle = BG;
    for (let k = 0; k < L.length; k += 2) ctx.fillRect(L[k] * cw - .5, L[k + 1] * ch - .5, cw + 1, ch + 1);
    ctx.fillStyle = color;
    for (let k = 0; k < L.length; k += 2) ctx.fillText(s, (L[k] + .5) * cw, (L[k + 1] + .5) * ch);
  };

  function draw(t) {
    const a = t / 1000 * SPEED, cx = W / 2, cy = H / 2, L = [[], [], [], []]; // 阳#、阳*、阴#、阴*
    ctx.drawImage(off, 0, 0, W, H);
    for (let j = Math.floor((cy - 1.06 * R) / ch); j <= Math.ceil((cy + 1.06 * R) / ch); j++)
      for (let i = Math.floor((cx - 1.06 * R) / cw); i <= Math.ceil((cx + 1.06 * R) / cw); i++) {
        const x = (i + .5) * cw - cx, y = (j + .5) * ch - cy, c = cls(x, y, a);
        if (!c) continue;
        // 四周有不同类的邻居 → 边缘 *；否则内部 #
        const edge = cls(x - cw, y, a) !== c || cls(x + cw, y, a) !== c || cls(x, y - ch, a) !== c || cls(x, y + ch, a) !== c;
        L[(c - 1) * 2 + edge].push(i, j);
      }
    L.forEach((l, n) => paint(l, n % 2 ? '*' : '#', n < 2 ? YANG : YIN));
  }

  const redo = () => { setup(); draw(performance.now()); };
  const loop = t => { draw(t); requestAnimationFrame(loop); };
  setup();
  addEventListener('resize', redo);
  new MutationObserver(redo).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] }); // 切换主题时换色
  // 系统开启“减少动画”时只显示静态画面
  matchMedia('(prefers-reduced-motion:reduce)').matches ? draw(0) : requestAnimationFrame(loop);
})();
</script>
</body>
</html>
